set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# w0zro: truecolor + undercurl passthrough for Ghostty (TERM=xterm-ghostty).
# The line above only matches xterm-256color, so Ghostty needs its own.
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m'

# prefix is ^<space> as space is easier to strike
# from either hand
set -g prefix C-space
bind-key space send-prefix

# toggle between current and previous window
bind-key C-space last-window

# reload tmux conf with ^<space>r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# mouse
set -g mouse on

# mouse copy/paste behavior
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# moving between panes
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

bind-key C-h previous-window
bind-key C-l next-window

# kill session
bind-key q kill-session

# status line
set -g status-style bg=black
set -g status-justify centre
setw -g status-left ""
setw -g status-right ""
setw -g window-status-format "#[bg=default, fg=brightblack]● #[bg=default]"
setw -g window-status-current-format "#[bg=default, fg=white]● #[bg=default]"

# Toggle mouse on with ^<space> m / off with ^<space> M
bind m set -g mouse on \;\
  display 'Mouse: ON'
bind M set -g mouse off \;\
  display 'Mouse: OFF'

set -g allow-passthrough
