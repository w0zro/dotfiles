# AeroSpace — tiling window manager. Docs: https://nikitabobko.github.io/AeroSpace/guide
#
# Replaces the old phoenix.js. Phoenix floated windows into halves/quarters;
# AeroSpace auto-tiles them in a tree with workspaces. The cmd+ctrl + hjkl
# muscle memory is preserved, but hjkl now means "focus in that direction"
# and shift+hjkl means "move the window in that direction".

start-at-login = true

# Keep the window tree tidy as windows come and go.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'  # widescreen splits horizontally, tall splits vertically
accordion-padding = 30

# Breathing room (Phoenix used a 30px pad; tiling reads cleaner smaller — tune to taste).
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.right = 10
outer.top = 10
outer.bottom = 10

[mode.main.binding]
# focus (hjkl) — same cmd+ctrl modifier as the old Phoenix config
cmd-ctrl-h = 'focus left'
cmd-ctrl-j = 'focus down'
cmd-ctrl-k = 'focus up'
cmd-ctrl-l = 'focus right'

# move the focused window (hjkl + shift)
cmd-ctrl-shift-h = 'move left'
cmd-ctrl-shift-j = 'move down'
cmd-ctrl-shift-k = 'move up'
cmd-ctrl-shift-l = 'move right'

# layout
cmd-ctrl-slash = 'layout tiles horizontal vertical'      # flip split orientation
cmd-ctrl-comma = 'layout accordion horizontal vertical'  # accordion (stacked) layout
cmd-ctrl-f     = 'layout floating tiling'                 # float/unfloat this window
cmd-ctrl-m     = 'fullscreen'                             # was Phoenix's maximize (space)

# resize
cmd-ctrl-minus = 'resize smart -50'
cmd-ctrl-equal = 'resize smart +50'

# workspaces
cmd-ctrl-1 = 'workspace 1'
cmd-ctrl-2 = 'workspace 2'
cmd-ctrl-3 = 'workspace 3'
cmd-ctrl-4 = 'workspace 4'
cmd-ctrl-shift-1 = 'move-node-to-workspace 1'
cmd-ctrl-shift-2 = 'move-node-to-workspace 2'
cmd-ctrl-shift-3 = 'move-node-to-workspace 3'
cmd-ctrl-shift-4 = 'move-node-to-workspace 4'
cmd-ctrl-tab = 'workspace-back-and-forth'                # was Phoenix's move-to-next-screen (o)

# move the whole workspace to the next monitor (was Phoenix's 'o')
cmd-ctrl-o = 'move-workspace-to-monitor --wrap-around next'

# service mode: cmd+ctrl+; then a single key, then it returns to main
cmd-ctrl-semicolon = 'mode service'

[mode.service.binding]
esc       = ['reload-config', 'mode main']               # was Phoenix's reload (r)
r         = ['flatten-workspace-tree', 'mode main']      # reset the layout tree
f         = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
